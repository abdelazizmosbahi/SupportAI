services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supportai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: supportai
      POSTGRES_PASSWORD: supportai
      POSTGRES_DB: supportai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportai -d supportai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supportai-network

  redis:
    image: redis:7-alpine
    container_name: supportai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - supportai-network

  minio:
    image: minio/minio:latest
    container_name: supportai-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supportai-network

  ollama:
    image: ollama/ollama:latest
    container_name: supportai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supportai-network

  backend:
    build:
      context: ./backend
      target: dev
    container_name: supportai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://supportai:supportai@postgres:5432/supportai
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      LLM_HOST: http://ollama:11434
      APP_ENV: development
      DEBUG: "true"
      JWT_SECRET: dev-secret-change-in-production
      LLM_MODEL: qwen2:0.5b
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - supportai-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

networks:
  supportai-network:
    driver: bridge
